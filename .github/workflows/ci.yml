name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable

      - name: Download dependencies
        run: |
          go mod download
          go mod download -modfile=ci-tools/go.mod

      - name: Verify dependencies
        run: |
          go mod verify
          go mod verify -modfile=ci-tools/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go tool -modfile=ci-tools/go.mod gotestsum --format pkgname-and-test-fails -- -race ./...

      - name: Lint
        run: go tool -modfile=ci-tools/go.mod golangci-lint run --timeout=5m
