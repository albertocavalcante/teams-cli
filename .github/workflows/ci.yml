name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Conventional Commit subjects
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git log --format=%s "$BASE_SHA..$HEAD_SHA" | ./scripts/check-commit-subjects.sh
          else
            git log --format=%s | ./scripts/check-commit-subjects.sh
          fi

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable

      - name: Download dependencies
        run: |
          go mod download
          go mod download -modfile=ci-tools/go.mod

      - name: Verify dependencies
        run: |
          go mod verify
          go mod verify -modfile=ci-tools/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go tool -modfile=ci-tools/go.mod gotestsum --format pkgname-and-test-fails -- -race ./...

      - name: Lint
        run: go tool -modfile=ci-tools/go.mod golangci-lint run --timeout=5m
