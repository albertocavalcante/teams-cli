name: CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: stable

      - name: Download dependencies
        run: |
          go mod download
          go mod download -modfile=tools.go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go tool -modfile=tools.go.mod gotestsum --format pkgname-and-test-fails -- -race ./...

      - name: Lint
        run: go tool -modfile=tools.go.mod golangci-lint run --timeout=5m
