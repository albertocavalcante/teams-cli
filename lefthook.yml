# Lefthook configuration
# Install: lefthook install

pre-commit:
  parallel: true
  commands:
    ci:
      run: just ci
      fail_text: "Teams CLI checks failed; run 'just ci' and fix the reported errors."

commit-msg:
  commands:
    semantic-commit:
      run: head -n 1 {1} | ./scripts/check-commit-subjects.sh
      fail_text: "Invalid commit subject; use a Conventional Commit (72 characters max)."

output:
  - meta
  - summary
  - success
